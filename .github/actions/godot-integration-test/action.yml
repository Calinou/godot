name: Integration tests
description: Run integration tests on an empty project.

inputs:
  bin:
    description: The path to the Godot executable
    required: true

runs:
  using: composite
  steps:
    - name: Create empty project
      shell: sh
      run: |
        mkdir -p /tmp/empty_project
        cat << 'EOF' > /tmp/empty_project/project.godot
        [project]

        config_version=4

        [application]

        run/main_scene="res://main.tscn"
        EOF

        cat << 'EOF' > /tmp/empty_project/main.tscn
        [gd_scene format=3 uid="uid://ci481nekvysd8"]

        [node name="Node" type="Node"]
        EOF

        cat << 'EOF' > /tmp/empty_project/export_presets.cfg
        [preset.0]

        name="Linux"
        platform="Linux"
        runnable=true
        advanced_options=false
        dedicated_server=false
        custom_features=""
        export_filter="all_resources"
        include_filter=""
        exclude_filter=""
        export_path=""
        patches=PackedStringArray()
        encryption_include_filters=""
        encryption_exclude_filters=""
        seed=0
        encrypt_pck=false
        encrypt_directory=false
        script_export_mode=2

        [preset.0.options]

        custom_template/debug=""
        custom_template/release=""
        debug/export_console_wrapper=1
        binary_format/embed_pck=false
        texture_format/s3tc_bptc=true
        texture_format/etc2_astc=false
        binary_format/architecture="x86_64"
        ssh_remote_deploy/enabled=false
        ssh_remote_deploy/host="user@host_ip"
        ssh_remote_deploy/port="22"
        ssh_remote_deploy/extra_args_ssh=""
        ssh_remote_deploy/extra_args_scp=""
        ssh_remote_deploy/run_script="#!/usr/bin/env bash
        export DISPLAY=:0
        unzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"
        \"{temp_dir}/{exe_name}\" {cmd_args}"
        ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash
        kill $(pgrep -x -f \"{temp_dir}/{exe_name} {cmd_args}\")
        rm -rf \"{temp_dir}\""
        EOF

    - name: Test PCK export
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} 40 --path /tmp/empty_project --export-pack Linux /tmp/out.pck
        file /tmp/out.pck
        pck=$(wc -c <"/tmp/out.pck")
        echo "PCK size: $pck"
        if [[ "$pck" -lt 1000 ]]; then
          echo "ERROR: The PCK file generated by --export-pack is too small. This hints at a possible error in the PCKPacker code or its dependencies."
          exit 1
        fi

    - name: Test ZIP export
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} 40 --path /tmp/empty_project --export-pack Linux /tmp/out.zip
        file /tmp/out.zip
        zip_size=$(wc -c <"/tmp/out.zip")
        echo "ZIP size: $zip_size"
        if [[ "$zip_size" -lt 1000 ]]; then
          echo "ERROR: The ZIP file generated by --export-pack is too small. This hints at a possible error in the ZIP export code or its dependencies."
          exit 1
        fi

    - name: Test MovieWriterMJPEG
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} 40 --path /tmp/empty_project --write-movie /tmp/out.avi --quit
        file /tmp/out.avi
        avi_size=$(wc -c <"/tmp/out.avi")
        echo "AVI size: $avi_size"
        if [[ "$avi_size" -lt 1000 ]]; then
          echo "ERROR: The AVI file generated by MovieWriterMJPEG is too small. This hints at a possible error in the MovieWriterMJPEG code or its dependencies."
          exit 1
        fi

    - name: Test MovieWriterPNGWAV
      shell: sh
      run: |
        xvfb-run ${{ inputs.bin }} 40 --path /tmp/empty_project --write-movie /tmp/out.png --quit
        file /tmp/out.png
        png_size=$(wc -c <"/tmp/out.png")
        echo "PNG size: $png_size"
        if [[ "$png_size" -lt 1000 ]]; then
          echo "ERROR: The PNG file generated by MovieWriterMJPEG is too small ($png_size bytes). This hints at a possible error in the MovieWriterMJPEG code or its dependencies."
          exit 1
        fi
        file /tmp/out.wav
        wav_size=$(wc -c <"/tmp/out.wav")
        echo "PNG size: $png_size"
        if [[ "$wav_size" -lt 1000 ]]; then
          echo "ERROR: The WAV file generated by MovieWriterMJPEG is too small ($wav_size bytes). This hints at a possible error in the MovieWriterMJPEG code or its dependencies."
          exit 1
        fi
